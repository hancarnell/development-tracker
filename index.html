<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Valiant Construction Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout concept: left section rail + one working column. Summary first, detail below.
   Brand: Valiant black, bronze, pale gold, ivory. Chart hues come from a validated categorical set. */
:root {
  --bg: #F3F1EC;
  --surface: #FBFAF7;
  --surface2: #EAE7E1;
  --ink: #1D1D1D;
  --ink2: #55524B;
  --muted: #6F6B62;
  --line: #E2DED5;
  --axis: #C9C3B6;
  --accent: #7F6B42;
  --accent-ink: #FFFDF8;
  --gold: #AD9978;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #898781;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --bad: #d03b3b;
  --bad-ink: #a82727;
  --focus: #2a78d6;
  --tip-bg: #1D1D1D;
  --tip-ink: #F3F1EC;
  --tip-dim: #B9B5A9;
  --font: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1D1D1D; --surface2: #2A2927; --ink: #F0EEE8; --ink2: #C3C0B6; --muted: #A09C90;
    --line: #2E2D2A; --axis: #44423D; --accent: #AD9978; --accent-ink: #1D1D1D; --gold: #AD9978;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #898781;
    --good-ink: #0ca30c; --warn-ink: #fab219; --bad: #e66767; --bad-ink: #e66767; --focus: #6da7ec;
    --tip-bg: #F0EEE8; --tip-ink: #1D1D1D; --tip-dim: #55524B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1D1D1D; --surface2: #2A2927; --ink: #F0EEE8; --ink2: #C3C0B6; --muted: #A09C90;
  --line: #2E2D2A; --axis: #44423D; --accent: #AD9978; --accent-ink: #1D1D1D; --gold: #AD9978;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #898781;
  --good-ink: #0ca30c; --warn-ink: #fab219; --bad: #e66767; --bad-ink: #e66767; --focus: #6da7ec;
  --tip-bg: #F0EEE8; --tip-ink: #1D1D1D; --tip-dim: #55524B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 13px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; max-width: 1380px; margin: 0 auto; padding-block: 20px 48px; }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-weight: 600; font-size: 15px; flex: none; }
.brand b { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; }
.nav-items { display: flex; flex-direction: column; gap: 2px; }
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; text-align: left; color: var(--ink2); font-weight: 500; }
.nav-btn svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--surface2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--ink); color: var(--bg); }
.nav-btn .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #1D1D1D; font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.sync { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.sync.busy i { background: var(--warn); }
.sync.off i { background: var(--s4); }

.main { min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--ink2); margin-top: 4px; max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.danger { border-color: var(--bad); color: var(--bad-ink); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card + .card, .stack > * + * { margin-top: 16px; }
.card h2 { font-size: 15px; font-weight: 600; }
.card .lead { color: var(--ink2); margin-top: 2px; font-size: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.top-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero-num { font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
.hero-line { color: var(--ink2); font-size: 14px; }
.hero-line strong { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); background: var(--surface2); width: fit-content; }
.pill svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pill.good { color: var(--good-ink); }
.pill.warn { color: var(--warn-ink); }
.pill.bad { color: var(--bad-ink); }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); margin: 14px 0 22px; }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--accent); }
.meter .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.meter .mark span { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--ink2); white-space: nowrap; }
.hero-sub { color: var(--ink2); font-size: 12px; display: flex; gap: 6px 18px; flex-wrap: wrap; }
.hero-sub b { color: var(--ink); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; text-align: left; display: block; width: 100%; }
button.tile { cursor: pointer; }
button.tile:hover { background: var(--surface2); }
.t-label { color: var(--ink2); font-size: 12px; }
.t-val { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; margin: 2px 0; }
.t-sub { color: var(--muted); font-size: 12px; line-height: 1.4; }
.t-val.dim { color: var(--muted); font-size: 18px; font-weight: 500; }

.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.two > .card + .card { margin-top: 0; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend .ln { width: 16px; height: 2px; display: inline-block; }
.chart { width: 100%; min-height: 120px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); }
.chart .tick { fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .vlabel { fill: var(--ink); font-size: 11px; font-weight: 500; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover, .chart .hit:focus { fill: var(--ink); fill-opacity: .06; outline: none; }
.chart .note { fill: var(--ink2); font-size: 11px; }
.empty-chart { color: var(--muted); padding: 24px 0; }

.hb { display: grid; grid-template-columns: minmax(90px, 1.2fr) minmax(0, 2fr) auto; gap: 10px; align-items: center; padding: 5px 0; }
.hb-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.hb-t { height: 10px; background: transparent; position: relative; }
.hb-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.hb-v { font-weight: 500; min-width: 54px; text-align: right; }
.hb-sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; }

.att { display: flex; flex-direction: column; }
.att-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.att-row:first-child { border-top: 0; padding-top: 0; }
.att-ic { width: 18px; height: 18px; margin-top: 2px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.att-ic.warn { color: var(--warn-ink); } .att-ic.good { color: var(--good-ink); } .att-ic.info { color: var(--muted); }
.att-t { font-weight: 500; }
.att-d { color: var(--ink2); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; }

.filters { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink2); }
.field .hint { font-size: 11px; color: var(--muted); }
.ctl { border: 1px solid var(--axis); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
.ctl:disabled { opacity: .6; }
.filters .ctl { width: auto; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink2); }
.chk input { width: 15px; height: 15px; accent-color: var(--accent); }

.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 100%; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface2); font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--ink2); z-index: 2; padding: 9px 8px; }
th.r, td.r { text-align: right; }
td.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 10px; }
tr:last-child td { border-bottom: 0; }
tr.dim td { color: var(--muted); }
tr.total td { font-weight: 600; background: var(--surface2); border-top: 1px solid var(--axis); }
td.stick, th.stick { position: sticky; left: 0; background: var(--surface); z-index: 1; border-right: 1px solid var(--line); }
th.stick { background: var(--surface2); z-index: 3; }
tr.total td.stick { background: var(--surface2); }
.in { border: 1px solid transparent; background: transparent; padding: 5px 6px; border-radius: 6px; width: 100%; min-width: 0; }
.in:hover { border-color: var(--axis); }
.in:focus { border-color: var(--focus); background: var(--surface); outline: none; }
.in:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: currentColor; }
.in.r { text-align: right; }
select.in { appearance: none; -webkit-appearance: none; padding-right: 6px; cursor: pointer; }
select.in:disabled { cursor: default; }
td.warncell { background: color-mix(in srgb, var(--warn) 18%, transparent); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface2); color: var(--ink2); margin-left: 6px; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
.x:hover { background: var(--surface2); color: var(--bad-ink); }
.x.sure { background: var(--bad); color: #fff; }
.w-name { min-width: 210px; } .w-cat { min-width: 118px; } .w-status { min-width: 160px; } .w-money { min-width: 112px; } .w-pct { min-width: 66px; }
.w-date { min-width: 128px; } .w-sm { min-width: 96px; } .w-notes { min-width: 240px; } .w-id { min-width: 66px; }
input[type="date"].in { padding: 4px 6px; }

.range-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
output { font-weight: 600; min-width: 74px; text-align: right; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 18px; }
.callout { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 14px 16px; color: var(--ink2); }
.callout b { color: var(--ink); }
.delta.good { color: var(--good-ink); } .delta.bad { color: var(--bad-ink); }
.muted { color: var(--muted); }
.note-txt { font-size: 12px; color: var(--muted); margin-top: 8px; }
.empty { text-align: center; padding: 56px 16px; }
.empty h2 { font-size: 18px; margin-bottom: 6px; }
.empty p { color: var(--ink2); max-width: 54ch; margin: 0 auto 16px; }
.scroll-x { overflow-x: auto; max-width: 100%; }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 8px; padding: 9px 11px; font-size: 12px; min-width: 150px; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
.tt-h { font-weight: 600; margin-bottom: 5px; }
.tt-r { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 1px 0; }
.tt-k { width: 12px; height: 3px; border-radius: 2px; }
.tt-n { color: var(--tip-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-v { font-weight: 600; text-align: right; }
.tt-f { border-top: 1px solid color-mix(in srgb, var(--tip-ink) 22%, transparent); margin-top: 5px; padding-top: 5px; color: var(--tip-dim); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 60; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); }

@media (max-width: 1000px) {
  .top-grid, .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 40px; }
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; flex-direction: row; align-items: center; gap: 8px; background: var(--bg); padding: 8px 0; margin-inline: 0; border-bottom: 1px solid var(--line); }
  .brand small { display: none; }
  .brand b { display: none; }
  .nav-items { flex-direction: row; overflow-x: auto; flex: 1; min-width: 0; gap: 4px; scrollbar-width: none; }
  .nav-btn { white-space: nowrap; padding: 7px 10px; }
  .sync span { display: none; }
  .hero-num { font-size: 44px; }
  .head h1 { font-size: 21px; }
}
@media (max-width: 520px) {
  .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .t-val { font-size: 21px; }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter .fill { transition: width .4s ease; }
}
</style>
</head>
<body>

<div class="shell">
  <nav class="nav" aria-label="Sections">
    <div class="brand"><span class="mark">V</span><div><b>Valiant Group</b><small>Construction planner</small></div></div>
    <div class="nav-items" id="nav"></div>
    <div class="sync off" id="sync" role="status"><i></i><span>Connecting</span></div>
  </nav>
  <main class="main"><div id="view" aria-live="polite"></div></main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* Supabase adapter: gives the planner the same small db/user/downloads surface it had inside Claude.
   Tables: projects, capital, settings (id text, data jsonb), plus history and profiles. */
(function () {
  window.VALIANT_BACKEND = true;
  var cfg = window.VALIANT_CONFIG || {};
  var resolveReady, readyP = new Promise(function (r) { resolveReady = r; });
  var S = { sb: null, session: null, role: null };

  /* ---------- sign-in overlay ---------- */
  var ov = document.createElement('div');
  ov.id = 'auth';
  ov.innerHTML = '<style>#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--font);color:var(--ink)}' +
    '#auth .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}' +
    '#auth h1{font-size:20px;margin:0 0 4px}#auth p{color:var(--ink2);margin:0 0 16px;font-size:13px;line-height:1.5}' +
    '#auth label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}' +
    '#auth input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--axis);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}' +
    '#auth .row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}#auth .msg{margin-top:14px;font-size:13px;color:var(--ink2)}#auth .msg.err{color:var(--bad-ink)}</style>' +
    '<div class="card"><h1>Valiant Construction Planner</h1><div id="auth-body"></div></div>';
  function mountOverlay() { if (!ov.isConnected) document.body.appendChild(ov); }
  var body = function () { return ov.querySelector('#auth-body'); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function showMessage(title, text, withSignOut) {
    mountOverlay();
    body().innerHTML = '<p><strong>' + esc(title) + '</strong><br>' + esc(text) + '</p>' + (withSignOut ? '<div class="row"><button class="btn" id="a-out">Sign out</button></div>' : '');
    var b = body().querySelector('#a-out'); if (b) b.onclick = signOut;
  }
  function showForm(note) {
    mountOverlay();
    body().innerHTML = '<p>Sign in with your work email to see and edit the shared plan.</p>' +
      '<form id="a-form"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="username" required>' +
      '<label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="current-password" minlength="8" required>' +
      '<div class="row"><button class="btn primary" type="submit" id="a-in">Sign in</button><button class="btn" type="button" id="a-up">Create account</button></div></form>' +
      '<div class="msg" id="a-msg" role="status">' + esc(note || '') + '</div>';
    var msg = function (t, bad) { var m = body().querySelector('#a-msg'); m.textContent = t; m.className = 'msg' + (bad ? ' err' : ''); };
    var creds = function () { return { email: body().querySelector('#a-email').value.trim(), password: body().querySelector('#a-pw').value }; };
    body().querySelector('#a-form').onsubmit = function (e) {
      e.preventDefault(); msg('Signing in…');
      S.sb.auth.signInWithPassword(creds()).then(function (r) { if (r.error) msg(r.error.message, true); });
    };
    body().querySelector('#a-up').onclick = function () {
      var c = creds(); if (!c.email || c.password.length < 8) { msg('Enter your email and a password of at least 8 characters.', true); return; }
      msg('Creating account…');
      S.sb.auth.signUp(c).then(function (r) {
        if (r.error) { msg(r.error.message, true); return; }
        if (!r.data.session) msg('Check your email to confirm the account, then sign in here.');
      });
    };
  }
  function signOut() { S.sb.auth.signOut().then(function () { location.reload(); }); }

  /* ---------- session and role ---------- */

  }
  function Watcher(table) {
    var w = { table: table, map: new Map(), subs: [], loaded: null };
    w.emit = function () { w.subs.forEach(function (s) { s(); }); };
    w.load = async function () {
      var r = await S.sb.from(table).select('id,data');
      if (r.error) throw r.error;
      w.map = new Map(r.data.map(function (x) { return [x.id, x.data]; }));
      w.emit();
    };
    w.start = function () {
      if (w.loaded) return w.loaded;
      w.loaded = w.load();
      S.sb.channel('rt-' + table).on('postgres_changes', { event: '*', schema: 'public', table: table }, function (p) {
        if (p.eventType === 'DELETE') w.map.delete(p.old.id); else w.map.set(p.new.id, p.new.data);
        w.emit();
      }).subscribe(function (status) { if (status === 'SUBSCRIBED' && w.synced) w.load().catch(console.error); if (status === 'SUBSCRIBED') w.synced = true; });

  var watcher = function (t) { return W[t] || (W[t] = Watcher(t)); };
  function err(e) { var x = new Error(e && e.message || 'Save failed'); x.code = e && e.code; return x; }

  var db = {
    collection: function (t) {
      return { onSnapshot: function (cb, onErr) {
        var w = watcher(t);
        w.subs.push(function () { cb(snapOf(w.map)); });
        w.start().catch(function (e) { onErr && onErr(e); });

          w.subs.push(fire); w.start().catch(function (e) { onErr && onErr(e); });

          if (r.error) throw err(r.error);
          var w = watcher(t), cur = w.map.get(id); if (cur) { w.map.set(id, Object.assign({}, cur, patch)); w.emit(); }
        },
        delete: async function () {
          var r = await S.sb.from(t).delete().eq('id', id);
          if (r.error) throw err(r.error);

      };
    },
    history: async function (limit) {
      var r = await S.sb.from('history').select('at,by_email,tbl,row_id,op,old_data,new_data').order('at', { ascending: false }).limit(limit || 300);
      if (r.error) throw err(r.error);

  };

  var user = {

  var downloads = {

      var blob = new Blob([o.data], { type: type }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

      if (r.error) throw err(r.error);
      if (!r.data || !r.data.length) throw new Error('Not allowed.');
    }
  };
  window.claude = { use: async function (name) {
    await readyP;
    return name === 'db' ? db : name === 'user' ? user : name === 'downloads' ? downloads : name === 'team' && S.role === 'admin' ? team : null;
  } };

  /* ---------- start ---------- */
  function start() {
    if (!cfg.url || !cfg.anonKey || /YOUR-/.test(cfg.anonKey)) { showMessage('Setup needed', 'Open config.js and paste your Supabase project URL and public (anon) key, then reload.'); return; }
    if (!window.supabase) { showMessage('Could not load', 'The Supabase library did not load. Check your connection and reload.'); return; }
    S.sb = window.supabase.createClient(cfg.url, cfg.anonKey);

<script>
/* ===== ENGINE: pure functions, no DOM. Months are integers: year*12 + (month-1). ===== */
const Engine = (() => {
  const HORIZON = 52; // months after the as-of month (Sep 2026 -> Dec 2030 in the original workbook)

  const DEFAULTS = {
    goalYear: 2027, goal: 50000000, asOf: '2026-08-31',
    earlyEnd: 0.2, midEnd: 0.8, wEarly: 0.6, wMid: 1.25, wLate: 0.65,
    margin: null, overhead: 0, useWeighted: true
  };

  const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
  const mi = s => {
    if (!s || typeof s !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (!m) return null;
    return Number(m[1]) * 12 + Number(m[2]) - 1;
  };
  const miYear = m => Math.floor(m / 12);
  const miMonth = m => (m % 12) + 1;
  const miIso = m => miYear(m) + '-' + String(miMonth(m)).padStart(2, '0') + '-01';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const miLabel = (m, withYear) => MON[miMonth(m) - 1] + (withYear ? ' ' + String(miYear(m)).slice(2) : '');
  const miLong = m => MON[miMonth(m) - 1] + ' ' + miYear(m);

  function settingsFrom(raw) {
    const s = Object.assign({}, DEFAULTS, raw || {});
    s.goalYear = Math.round(num(s.goalYear)) || DEFAULTS.goalYear;
    return s;
  }

  function context(settings) {
    const s = settingsFrom(settings);
    const asOfM = mi(s.asOf) ?? mi(DEFAULTS.asOf);
    const first = asOfM + 1; // first forecast month
    const months = [];
    for (let i = 0; i < HORIZON; i++) months.push(first + i);
    return { s, asOfM, first, months, yearStart: s.goalYear * 12, yearEnd: s.goalYear * 12 + 11 };
  }

  // adj: {delay, extend, ps:{start,end}} scenario shifts in months
  function schedule(p, ctx, adj) {
    adj = adj || {};
    const startRaw = mi(p.start), endRaw = mi(p.completion);
    let startM = startRaw, endM = endRaw;
    const started = p.startType === 'Actual' || (startRaw !== null && startRaw < ctx.first);
    if (startRaw !== null) {
      if (!started) {
        const shift = num(adj.delay) + num(adj.ps && adj.ps.start);
        startM = startRaw + shift;
        if (endRaw !== null) endM = endRaw + shift;
      }
    }
    if (endM !== null) endM += num(adj.extend) + num(adj.ps && adj.ps.end);
    const eff = startM === null ? null : Math.max(startM, ctx.first);
    if (eff !== null && endM !== null && endM < eff) endM = eff; // never finish before the forecast starts
    return { startM, endM, eff, started, startRaw, endRaw };
  }

  function weights(sch, ctx) {
    const s = ctx.s;
    const w = new Array(ctx.months.length).fill(0);
    if (sch.eff === null || sch.endM === null) return { w, count: 0 };
    const count = sch.endM - sch.eff + 1;
    ctx.months.forEach((m, i) => {
      if (m < sch.eff || m > sch.endM) return;
      const ratio = (m - sch.eff + 1) / Math.max(1, count);
      w[i] = ratio <= s.earlyEnd ? s.wEarly : ratio <= s.midEnd ? s.wMid : s.wLate;
    });
    return { w, count };
  }

  function remaining(p) {
    return num(p.contract) * (1 - Math.min(1, Math.max(0, num(p.pctComplete))));
  }

  function projectRows(projects, ctx, scen) {
    return projects.map(p => {
      const adj = scen ? { delay: scen.delay, extend: scen.extend, ps: scen.per && scen.per[p.id] } : null;
      const sch = schedule(p, ctx, adj);
      const { w, count } = weights(sch, ctx);
      const sum = w.reduce((a, b) => a + b, 0);
      const rem = remaining(p);
      const rev = w.map(x => sum > 0 ? x / sum * rem : 0);
      const counts = p.counts === 'Yes';
      const conf = p.confidence == null ? 1 : num(p.confidence);
      let yearRev = 0, afterYear = 0;
      ctx.months.forEach((m, i) => {
        if (m >= ctx.yearStart && m <= ctx.yearEnd) yearRev += rev[i];
        else if (m > ctx.yearEnd) afterYear += rev[i];
      });
      return {
        p, sch, count, rev, remaining: rem, counts, conf,
        yearRev: counts ? yearRev : 0, yearRevAll: yearRev,
        yearWeighted: counts ? yearRev * conf : 0,
        afterYear: counts ? afterYear : 0,
        undated: sch.eff === null || sch.endM === null
      };
    });
  }

  function marginPct(p, s) {
    if (p.margin != null && p.margin !== '' && isFinite(p.margin)) return Number(p.margin);
    if (s.margin != null && isFinite(s.margin)) return Number(s.margin);
    return null;
  }

  function capitalRows(capital, ctx) {
    return capital.map(c => {
      const dueM = mi(c.due);
      return { c, dueM, included: c.include === 'Yes', amount: num(c.amount), undated: dueM === null };
    });
  }

  function summarize(projects, capital, settings, scen) {
    const ctx = context(settings);
    const s = ctx.s;
    const rows = projectRows(projects, ctx, scen);
    const caps = capitalRows(capital, ctx);
    const n = ctx.months.length;
    const cats = ['Multifamily', 'Subdivision', 'Custom Home'];

    const base = new Array(n).fill(0), weighted = new Array(n).fill(0);
    const byCat = {}; cats.forEach(c => byCat[c] = new Array(n).fill(0));
    const marginBy = new Array(n).fill(0);
    rows.forEach(r => {
      if (!r.counts) return;
      const mp = marginPct(r.p, s);
      r.rev.forEach((v, i) => {
        base[i] += v; weighted[i] += v * r.conf;
        const c = byCat[r.p.category] ? r.p.category : null;
        if (c) byCat[c][i] += v;
        if (mp !== null) marginBy[i] += v * (s.useWeighted ? r.conf : 1) * mp;
      });
    });

    const capBy = new Array(n).fill(0), capLand = new Array(n).fill(0), capDesign = new Array(n).fill(0);
    let capBefore = 0, capYear = 0, capUnassigned = 0;
    caps.forEach(r => {
      if (r.undated) { capUnassigned += r.amount; return; }
      if (!r.included) return;
      const i = r.dueM - ctx.first;
      if (r.dueM < ctx.yearStart) capBefore += r.amount;
      if (r.dueM >= ctx.yearStart && r.dueM <= ctx.yearEnd) capYear += r.amount;
      if (i >= 0 && i < n) {
        capBy[i] += r.amount;
        if (/land/i.test(r.c.type || '')) capLand[i] += r.amount; else capDesign[i] += r.amount;
      }
    });

    const inYear = (arr) => arr.reduce((a, v, i) => a + (ctx.months[i] >= ctx.yearStart && ctx.months[i] <= ctx.yearEnd ? v : 0), 0);
    const yearMonths = [];
    for (let m = ctx.yearStart; m <= ctx.yearEnd; m++) yearMonths.push(m);
    const idx = m => m - ctx.first;
    const pick = arr => yearMonths.map(m => (idx(m) >= 0 && idx(m) < n) ? arr[idx(m)] : 0);

    const totalContract = projects.reduce((a, p) => a + num(p.contract), 0);
    const backlog = rows.reduce((a, r) => a + r.remaining, 0);
    const unscheduled = projects.reduce((a, p, i) => a + (p.startType === 'TBD' ? num(p.contract) : 0), 0);
    const unscheduledCount = projects.filter(p => p.startType === 'TBD').length;

    // funding position: margin earned vs capital + overhead, month by month from first forecast month
    const mpSet = rows.some(r => r.counts && marginPct(r.p, s) !== null);
    const fund = [];
    let cm = 0, cc = 0, co = 0, minBal = 0, minAt = null;
    for (let i = 0; i < n; i++) {
      const m = ctx.months[i];
      if (m > ctx.yearEnd) break;
      cm += marginBy[i]; cc += capBy[i]; co += num(s.overhead);
      const bal = cm - cc - co;
      fund.push({ m, cm, cc: cc + co, capOnly: cc, bal });
      if (bal < minBal) { minBal = bal; minAt = m; }
    }

    return {
      ctx, s, rows, caps, base, weighted, byCat, cats, marginBy, capBy, capLand, capDesign,
      yearMonths, pick,
      yearBase: inYear(base), yearWeighted: inYear(weighted), yearMargin: inYear(marginBy),
      capBefore, capYear, capUnassigned,
      totalContract, backlog, unscheduled, unscheduledCount,
      fund, marginSet: mpSet, peakShortfall: -minBal, peakAt: minAt,
      afterYear: rows.reduce((a, r) => a + r.afterYear, 0)
    };
  }

  function checks(sum, projects, capital) {
    const ctx = sum.ctx, s = sum.s;
    const out = [];
    const missing = projects.filter(p => p.counts === 'Yes' && (!p.start || !p.completion));
    out.push({ id: 'dates', title: 'Projects missing construction dates', count: missing.length,
      detail: missing.length ? missing.map(p => p.name).join(', ') : 'Every project that counts toward the goal has both dates.',
      fix: 'projects', ok: missing.length === 0 });
    const reversed = projects.filter(p => p.start && p.completion && mi(p.completion) < mi(p.start));
    out.push({ id: 'order', title: 'Completion before start', count: reversed.length,
      detail: reversed.length ? reversed.map(p => p.name).join(', ') : 'All completion dates fall after their start dates.', fix: 'projects', ok: reversed.length === 0 });
    const alloc = sum.rows.filter(r => !r.undated).reduce((a, r) => a + r.rev.reduce((x, y) => x + y, 0) - r.remaining, 0);
    const lost = sum.rows.filter(r => !r.undated && Math.abs(r.rev.reduce((x, y) => x + y, 0) - r.remaining) > 1);
    out.push({ id: 'alloc', title: 'Scheduled revenue equals remaining contract value', count: lost.length,
      detail: lost.length ? lost.map(r => r.p.name).join(', ') + ' run past the forecast window.' : 'Every dated project spreads its full remaining value.', fix: 'projects', ok: lost.length === 0 });
    const stale = projects.filter(p => p.completion && mi(p.completion) < ctx.first && num(p.pctComplete) < 1);
    out.push({ id: 'stale', title: 'Past finish date but not 100% complete', count: stale.length,
      detail: stale.length ? stale.map(p => p.name).join(', ') : 'No project is overdue against its completion date.', fix: 'projects', ok: stale.length === 0 });
    const undatedCap = capital.filter(c => !c.due || c.dateType === 'TBD');
    out.push({ id: 'capdates', title: 'Capital events without a due date', count: undatedCap.length,
      detail: undatedCap.length ? undatedCap.map(c => c.project + ' (' + c.description + ')').join('; ') : 'Every capital event has a due date.', fix: 'capital', ok: undatedCap.length === 0 });
    const gap = Math.max(0, s.goal - sum.yearBase);
    out.push({ id: 'goal', title: s.goalYear + ' goal gap', count: gap > 0 ? 1 : 0,
      detail: gap > 0 ? 'Forecast is below the goal.' : 'Forecast meets or beats the goal.', fix: 'overview', ok: gap === 0 });
    const lowConf = projects.filter(p => p.counts === 'Yes' && num(p.confidence) < 1 && p.start && p.completion);
    out.push({ id: 'conf', title: 'Confidence discounts in the forecast', count: lowConf.length,
      detail: lowConf.length ? lowConf.map(p => p.name).join(', ') : 'Every dated project is at 100% confidence, so weighted equals base.', fix: 'projects', ok: true, info: true });
    return out;
  }

  return { DEFAULTS, HORIZON, mi, miYear, miMonth, miIso, miLabel, miLong, settingsFrom, context, schedule, weights, remaining,
    projectRows, summarize, checks, marginPct, num };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>

/* ---------- chart helpers (SVG strings; colors via style so CSS variables resolve) ---------- */
function niceScale(maxV, n) {
  n = n || 4;
  const raw = maxV / n || 1;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw) || mag * 10;
  const max = Math.ceil(maxV / step - 1e-9) * step;
  const ticks = []; for (let t = 0; t <= max + 1e-9; t += step) ticks.push(t);
  return { max: max || step, step, ticks };
}
function xLabels(labels, band, L, H, B) {
  const skip = Math.max(1, Math.ceil(40 / band));
  return labels.map((lb, i) => i % skip ? '' :
    '<text class="tick" x="' + (L + band * (i + .5)) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + esc(lb) + '</text>').join('');
}
function roundedTop(x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
}
function columnsChart(o) {
  const W = Math.max(280, o.w), H = o.h || 270, L = 54, R = 10, T = 16, B = 28;
  const pw = W - L - R, ph = H - T - B, n = o.labels.length;
  const totals = o.labels.map((_, i) => o.stacks.reduce((a, s) => a + nz(s.vals[i]), 0));
  const sc = niceScale(Math.max.apply(null, totals.concat([o.hline || 0, 1])) * 1.06, 4);
  const y = v => T + ph - v / sc.max * ph;
  const band = pw / n, bw = Math.min(24, band * .6);
  let g = '';
  sc.ticks.forEach(t => {
    g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
      '<text class="tick" x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + usdc(t) + '</text>';
  });
  g += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
  const maxI = totals.indexOf(Math.max.apply(null, totals));
  for (let i = 0; i < n; i++) {
    const x = L + band * i + (band - bw) / 2;
    let cum = 0; const segs = o.stacks.map(s => ({ s, v: nz(s.vals[i]) })).filter(d => d.v > 0);
    segs.forEach((d, k) => {
      const top = y(cum + d.v), h = y(cum) - top, last = k === segs.length - 1;
      const hh = k === 0 ? h : Math.max(0, h - 2);
      if (hh > .5) {
        g += last ? '<path d="' + roundedTop(x, top, bw, hh, 4) + '" style="fill:' + d.s.color + '"/>'
          : '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + hh + '" style="fill:' + d.s.color + '"/>';
      }
      cum += d.v;
    });
    if (totals[i] > 0 && (o.labels_mode === 'nonzero' || (o.labels_mode === 'max' && i === maxI))) {
      g += '<text class="vlabel" x="' + (x + bw / 2) + '" y="' + (y(totals[i]) - 6) + '" text-anchor="middle">' + usdc(totals[i]) + '</text>';
    }
  }
  if (o.hline) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.hline) + '" y2="' + y(o.hline) + '" style="stroke:var(--ink);stroke-width:1.5"/>';
  g += xLabels(o.labels, band, L, H, B);
  for (let i = 0; i < n; i++) {
    g += '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ph + '" tabindex="0" role="img" ' + tipAttr(o.tip(i)) + '/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + esc(o.title || 'Column chart') + '">' + g + '</svg>';
}
function linesChart(o) {
  const W = Math.max(280, o.w), H = o.h || 270, L = 54, R = 14, T = 16, B = 28;
  const pw = W - L - R, ph = H - T - B, n = o.labels.length;
  const all = []; o.series.forEach(s => s.vals.forEach(v => all.push(nz(v))));
  const sc = niceScale(Math.max.apply(null, all.concat([o.hline || 0, 1])) * 1.08, 4);
  const y = v => T + ph - v / sc.max * ph;
  const band = pw / n, X = i => L + band * (i + .5);
  let g = '';
  sc.ticks.forEach(t => {
    g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/>' +
      '<text class="tick" x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + usdc(t) + '</text>';
  });
  g += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
  if (o.shade) {
    let d = '';
    for (let i = 0; i < n - 1; i++) {
      const a = o.shade.hi[i], b = o.shade.hi[i + 1], c = o.shade.lo[i], e = o.shade.lo[i + 1];
      if (a > c || b > e) d += 'M' + X(i) + ',' + y(a) + 'L' + X(i + 1) + ',' + y(b) + 'L' + X(i + 1) + ',' + y(Math.min(b, e)) + 'L' + X(i) + ',' + y(Math.min(a, c)) + 'Z';
    }
    if (d) g += '<path d="' + d + '" style="fill:var(--bad);fill-opacity:.14"/>';
  }
  if (o.hline) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.hline) + '" y2="' + y(o.hline) + '" style="stroke:var(--ink);stroke-width:1.5"/>';
  o.series.forEach(s => {
    const pts = s.vals.map((v, i) => (i ? 'L' : 'M') + X(i) + ',' + y(nz(v))).join('');
    g += '<path d="' + pts + '" style="fill:none;stroke:' + s.color + ';stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>';
    const li = n - 1;
    g += '<circle cx="' + X(li) + '" cy="' + y(nz(s.vals[li])) + '" r="4" style="fill:' + s.color + ';stroke:var(--surface);stroke-width:2"/>';
  });
  if (o.mark != null) {
    const mx = X(o.mark.i), my = y(o.mark.v);
    const right = mx > W * .62;
    g += '<circle cx="' + mx + '" cy="' + my + '" r="5" style="fill:var(--bad);stroke:var(--surface);stroke-width:2"/>' +
      '<text class="note" x="' + (right ? mx - 10 : mx + 10) + '" y="' + (my - 8) + '" text-anchor="' + (right ? 'end' : 'start') + '">' + esc(o.mark.text) + '</text>';
  }
  g += xLabels(o.labels, band, L, H, B);
  for (let i = 0; i < n; i++) {
    g += '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ph + '" tabindex="0" role="img" ' + tipAttr(o.tip(i)) + '/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + esc(o.title || 'Line chart') + '">' + g + '</svg>';
}
const legendHtml = items => '<div class="legend">' + items.map(i => i.line

function viewOverview(sum) {
  const s = sum.s, gy = s.goalYear;
  const ratio = s.goal > 0 ? sum.yearBase / s.goal : 0, diff = sum.yearBase - s.goal;
  const scaleMax = Math.max(1, ratio), fillW = (ratio / scaleMax * 100).toFixed(2), markX = (1 / scaleMax * 100).toFixed(2);
  const ahead = diff >= 0;
  const nDated = sum.rows.filter(r => !r.undated).length;
  const hero = '<section class="card hero"><div class="eyebrow">' + gy + ' revenue forecast</div>' +
    '<div class="hero-num">' + usdc(sum.yearBase) + '</div>' +
    '<div class="hero-line"><strong>' + Math.round(ratio * 100) + '%</strong> of the ' + usdc(s.goal) + ' goal</div>' +
    (ahead ? pill('good', usdc(diff) + ' ahead of goal') : pill('bad', usdc(-diff) + ' short of goal')) +
    '<div class="meter" role="img" aria-label="Forecast is ' + Math.round(ratio * 100) + ' percent of goal"><div class="fill" style="width:' + fillW + '%"></div><div class="mark" style="left:' + markX + '%"><span>Goal ' + usdc(s.goal) + '</span></div></div>' +
    '<div class="hero-sub"><span><b>' + usdc(sum.yearWeighted) + '</b> weighted for confidence</span><span><b>' + nDated + '</b> of ' + sum.rows.length + ' projects have dates</span>' +
    (sum.afterYear > 0 ? '<span><b>' + usdc(sum.afterYear) + '</b> more lands after ' + gy + '</span>' : '') + '</div></section>';
  const marginTile = sum.marginSet
    ? tile('Margin left after costs', usdc(sum.yearMargin), 'in ' + gy + ' at ' + (s.margin != null ? pctS(s.margin, 1) : 'your project') + ' gross margin', 'margin')
    : tile('Margin left after costs', 'Not set', 'Enter your gross margin to see what the work funds', 'margin', true);
  const tiles = '<div class="tiles">' +
    tile('Capital due in ' + gy, usdc(sum.capYear), (sum.capBefore ? usdc(sum.capBefore) + ' due earlier. ' : '') + (sum.capUnassigned ? usdc(sum.capUnassigned) + ' has no date.' : 'All dated.'), 'capital') +
    tile('Remaining backlog', usdc(sum.backlog), 'of ' + usdc(sum.totalContract) + ' total contract value', 'projects') +
    tile('Unscheduled pipeline', usdc(sum.unscheduled), sum.unscheduledCount + ' project' + (sum.unscheduledCount === 1 ? '' : 's') + ' without dates', 'projects') +
    marginTile + '</div>';

  charts = [];
  charts.push({ id: 'rev', build: w => revenueChart(sum, w) });
  charts.push({ id: 'cap', build: w => capitalOverviewChart(sum, w) });

  const top = sum.rows.filter(r => r.counts && r.yearRev > 0).sort((a, b) => b.yearRev - a.yearRev);
  const shown = top.slice(0, 8), rest = top.slice(8);
  const maxV = shown.length ? shown[0].yearRev : 1;
  const bars = shown.map(r => {
    const share = sum.yearBase > 0 ? r.yearRev / sum.yearBase : 0;
    const tp = tipHtml(r.p.name, [{ name: r.p.category, val: usdc(r.yearRev), color: catColor(r.p.category) }, { name: 'Share of ' + gy, val: pctS(share, 1) }, { name: 'Remaining value', val: usdc(r.remaining) }], 'Finish ' + esc(fmtDate(r.p.completion) || 'not set'));
    return '<div class="hb" ' + tipAttr(tp) + ' tabindex="0"><span class="hb-n"><i class="hb-sw" style="background:' + catColor(r.p.category) + '"></i>' + esc(r.p.name) + '</span><span class="hb-t"><span class="hb-f" style="width:' + (r.yearRev / maxV * 100).toFixed(1) + '%;background:' + catColor(r.p.category) + '"></span></span><span class="hb-v">' + usdc(r.yearRev) + '</span></div>';
  }).join('') + (rest.length ? '<div class="hb"><span class="hb-n muted">' + rest.length + ' other projects</span><span></span><span class="hb-v muted">' + usdc(rest.reduce((a, r) => a + r.yearRev, 0)) + '</span></div>' : '');

  const cks = E.checks(sum, projectsSorted(), capitalSorted()).filter(c => !c.ok || c.info);
  const att = cks.length ? cks.map(c =>
    '<div class="att-row">' + (c.ok ? ATT_ICONS.info : ATT_ICONS.warn) + '<div><div class="att-t">' + esc(c.title) + (c.count ? ' <span class="tag">' + c.count + '</span>' : '') + '</div><div class="att-d">' + esc(c.detail) + '</div></div>' +
    '<button class="btn small" data-go="' + c.fix + '">Open</button></div>').join('')
    : '<div class="att-row">' + ATT_ICONS.good + '<div><div class="att-t">Nothing needs attention</div><div class="att-d">Every check passes.</div></div><span></span></div>';

  return head(gy + ' construction plan',
    'Forecast as of ' + esc(fmtDate(s.asOf)) + '. ' + sum.rows.length + ' projects. Edits save for everyone on the team.',
    '<button class="btn" data-act="export-forecast">Export CSV</button>') +
    '<div class="top-grid">' + hero + tiles + '</div>' +
    '<section class="card"><div class="card-h"><div><h2>Revenue by month against the goal</h2><p class="lead">Base forecast by project category. The line is the monthly goal of ' + usdc(s.goal / 12) + '.</p></div>' + chartToggle('rev') + '</div>' + chartSlot('rev') + '</section>' +
    '<div class="two"><section class="card"><div class="card-h"><div><h2>Capital due by month</h2><p class="lead">Land, design and preconstruction cash, from the capital plan.</p></div>' + chartToggle('cap') + '</div>' + chartSlot('cap') + '</section>' +
    '<section class="card"><div class="card-h"><div><h2>Where ' + gy + ' revenue comes from</h2><p class="lead">Largest projects by forecast revenue.</p></div></div>' + (bars || '<div class="empty-chart">No project has scheduled revenue in ' + gy + '.</div>') + '</section></div>' +
    '<section class="card" style="margin-top:16px"><div class="card-h"><div><h2>Needs attention</h2></div></div><div class="att">' + att + '</div></section>';
}

function revenueChart(sum, w) {
  const ym = sum.yearMonths, goal = sum.s.goal / 12;
  const stacks = sum.cats.map(c => ({ name: c, color: catColor(c), vals: sum.pick(sum.byCat[c]) }));
  const wt = sum.pick(sum.weighted), cp = sum.pick(sum.capBy), base = sum.pick(sum.base);
  if (ui.tables.rev) {
    return dataTable(['Month', 'Multifamily', 'Subdivision', 'Custom Home', 'Base', 'Weighted', 'Goal', 'Capital due'],
      ym.map((m, i) => [E.miLong(m), usd(stacks[0].vals[i]), usd(stacks[1].vals[i]), usd(stacks[2].vals[i]), usd(base[i]), usd(wt[i]), usd(goal), usd(cp[i])]),
      ['Total', usd(sum.pick(sum.byCat.Multifamily).reduce((a, b) => a + b, 0)), usd(sum.pick(sum.byCat.Subdivision).reduce((a, b) => a + b, 0)), usd(sum.pick(sum.byCat['Custom Home']).reduce((a, b) => a + b, 0)), usd(sum.yearBase), usd(sum.yearWeighted), usd(sum.s.goal), usd(sum.capYear)]);
  }
  const tip = i => {
    const tot = base[i];
    return tipHtml(E.miLong(ym[i]), stacks.map(s => ({ name: s.name, val: usdc(s.vals[i]), color: s.color })).concat([
      { name: 'Total', val: usdc(tot) }, { name: 'Weighted', val: usdc(wt[i]) }, { name: 'Monthly goal', val: usdc(goal), color: 'var(--ink)' }]),
      (tot >= goal ? usdc(tot - goal) + ' above goal' : usdc(goal - tot) + ' below goal') + (cp[i] ? '<br>Capital due ' + usdc(cp[i]) : ''));
  };

function scenChart(base, sc, w) {

  if (ui.tables.scen) return dataTable(['Month', 'Plan', 'Scenario', 'Change'], ym.map((m, i) => [E.miLong(m), usd(a[i]), usd(b[i]), usd(b[i] - a[i])]), ['Total', usd(base.yearBase), usd(sc.yearBase), usd(sc.yearBase - base.yearBase)]);
  const tip = i => tipHtml(E.miLong(ym[i]), [{ name: 'Scenario', val: usdc(b[i]), color: 'var(--s1)' }, { name: 'Plan', val: usdc(a[i]), color: 'var(--s4)' }, { name: 'Monthly goal', val: usdc(goal), color: 'var(--ink)' }], (b[i] - a[i] >= 0 ? '+' : '-') + usdc(Math.abs(b[i] - a[i])) + ' vs plan');

    linesChart({ w, h: 260, labels: ym.map(m => E.miLabel(m)), series: [{ name: 'Plan', color: 'var(--s4)', vals: a }, { name: 'Scenario', color: 'var(--s1)', vals: b }], hline: goal, tip, title: 'Plan against scenario' });
}
function gantt(base, sc, w) {
  const ctx = sc.ctx, rs = sc.rows.map((r, i) => ({ r, b: base.rows[i] })).filter(x => !x.r.undated || !x.b.undated);
  const undated = sc.rows.filter(r => r.undated);
  const rangeStart = Math.floor(ctx.asOfM / 12) * 12;
  let rangeEnd = rangeStart + 23;
  rs.forEach(x => { if (x.r.sch.endM != null) rangeEnd = Math.max(rangeEnd, x.r.sch.endM); if (x.b.sch.endM != null) rangeEnd = Math.max(rangeEnd, x.b.sch.endM); });
  rangeEnd = Math.ceil((rangeEnd + 1) / 3) * 3 - 1;
  const nM = rangeEnd - rangeStart + 1, labelW = 170, rowH = 24, topH = 34;
  const mw = Math.max(13, (w - labelW - 10) / nM), W = labelW + nM * mw + 10, H = topH + rs.length * rowH + 8;
  const X = m => labelW + (m - rangeStart) * mw;
  let g = '';
  const gyS = ctx.yearStart, gyE = ctx.yearEnd + 1;
  g += '<rect x="' + X(Math.max(gyS, rangeStart)) + '" y="' + topH + '" width="' + (X(Math.min(gyE, rangeEnd + 1)) - X(Math.max(gyS, rangeStart))) + '" height="' + (rs.length * rowH) + '" style="fill:var(--surface2);fill-opacity:.7"/>';
  for (let m = rangeStart; m <= rangeEnd + 1; m += 3) {
    g += '<line class="grid" x1="' + X(m) + '" x2="' + X(m) + '" y1="' + (m % 12 === 0 ? 4 : topH - 6) + '" y2="' + (topH + rs.length * rowH) + '"/>';
    if (m <= rangeEnd) g += '<text class="tick" x="' + (X(m) + 3) + '" y="' + (m % 12 === 0 ? 16 : topH - 10) + '" ' + (m % 12 === 0 ? 'style="font-weight:600;fill:var(--ink2)"' : '') + '>' + (m % 12 === 0 ? E.miYear(m) : 'Q' + ((E.miMonth(m) - 1) / 3 + 1)) + '</text>';
  }
  rs.forEach((x, i) => {
    const r = x.r, b = x.b, y = topH + i * rowH, bh = 10, by = y + (rowH - bh) / 2;
    const label = r.p.name.length > 25 ? r.p.name.slice(0, 24) + '…' : r.p.name;
    g += '<text class="tick" x="' + (labelW - 8) + '" y="' + (y + rowH / 2 + 4) + '" text-anchor="end" style="fill:var(--ink2)">' + esc(label) + '</text>';
    const col = catColor(r.p.category), op = r.counts ? 1 : .45;
    const geo = s => s.startM != null && s.endM != null ? { x1: X(Math.max(s.startM, rangeStart)), x2: X(s.endM + 1) } : null;
    const gb = geo(b.sch), gs = geo(r.sch);

function curveChart(s, w) {

  let g = '';
  sc.ticks.forEach(t => { g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph - t / sc.max * ph) + '" y2="' + (T + ph - t / sc.max * ph) + '"/><text class="tick" x="' + (L - 6) + '" y="' + (T + ph - t / sc.max * ph + 4) + '" text-anchor="end">' + Math.round(t) + '%</text>'; });
  g += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
  share.forEach((v, i) => {
    const x = L + band * i + (band - bw) / 2, top = y(v);
    g += '<path d="' + roundedTop(x, top, bw, y(0) - top, 4) + '" style="fill:var(--accent)"/>' +
      '<text class="tick" x="' + (L + band * (i + .5)) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + (i + 1) + '</text>' +
      '<rect class="hit" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ph + '" tabindex="0" role="img" ' + tipAttr(tipHtml('Month ' + (i + 1) + ' of 12', [{ name: 'Share of remaining value', val: pctS(v, 1), color: 'var(--accent)' }, { name: 'Weight', val: String(wts[i]) }])) + '/>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="Share of revenue by month of a 12-month job">' + g + '</svg><p class="note-txt">Month of the job along the bottom, share of its remaining value up the side.</p>';
}

   ===================================================================== */
const queues = new Map();
function enqueue(path, fn) {

  return next;
}
function applyLocal(coll, id, patch) {
  if (coll === 'settings') { Object.assign(state.settings, patch); return; }
  const arr = coll === 'projects' ? state.projects : state.capital;

}
function noteSaving(d) { state.saving = Math.max(0, state.saving + d); renderNav(); }
function writeFailed(e) {

}
async function saveField(coll, id, field, value, extra) {
  if (state.readOnly || !state.db) return;
  const patch = Object.assign({ [field]: value }, extra || {});
  applyLocal(coll, id, patch); scheduleRender();
  noteSaving(1);
  try {
    if (coll === 'settings') {
      const doc = Object.assign({}, S(), state.settings);
      await enqueue('settings/main', () => state.db.doc('settings/main').set(Object.assign({}, doc, { updatedAt: Date.now(), updatedBy: state.uid })));
    } else {
      await enqueue(coll + '/' + id, () => state.db.doc(coll + '/' + id).update(Object.assign({}, patch, { updatedAt: Date.now(), updatedBy: state.uid })));
    }
  } catch (e) { writeFailed(e); } finally { noteSaving(-1); }
}
async function addDoc(coll, id, doc) {
  if (state.readOnly || !state.db) return;
  noteSaving(1);
  try { await enqueue(coll + '/' + id, () => state.db.doc(coll + '/' + id).set(Object.assign({}, doc, { id, updatedAt: Date.now(), updatedBy: state.uid }))); }
  catch (e) { writeFailed(e); } finally { noteSaving(-1); }
}
async function deleteDoc(coll, id) {

  catch (e) { writeFailed(e); } finally { noteSaving(-1); }
}
function nextId(coll, prefix) {
  const arr = coll === 'projects' ? state.projects : state.capital;
  let n = 0; arr.forEach(x => { const m = new RegExp('^' + prefix + '-(\\d+)$').exec(x.id); if (m) n = Math.max(n, +m[1]); });

}
function parseVal(type, raw) {

  const f = parseFloat(raw.replace(/[^0-9.\-]/g, ''));
  switch (type) {
    case 'text': return raw.trim();
    case 'money': return isFinite(f) ? f : 0;
    case 'num': return raw.trim() === '' ? null : (isFinite(f) ? f : null);
    case 'pct': return isFinite(f) ? Math.min(1, Math.max(0, f / 100)) : 0;
    case 'pctnull': return raw.trim() === '' || !isFinite(f) ? null : Math.min(1, Math.max(0, f / 100));
    case 'date': return raw || null;
    case 'bool': return raw === 'true';

}

  if (coll === 'capital' && field === 'due') {
    const c = state.capital.find(x => x.id === id);
    if (c) extra = { dateType: v ? (c.dateType === 'TBD' || !c.dateType ? 'Estimated' : c.dateType) : 'TBD' };
  }
  saveField(coll, id, field, v, extra);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-scen]')) {
    const k = t.dataset.scen, v = parseInt(t.value, 10) || 0; ui.scen[k] = v;
    const o = document.getElementById('o-' + k); if (o) o.textContent = (k === 'extend' && v > 0 ? '+' : '') + v + ' mo';
    renderScen(); return;
  }
  if (t.matches('[data-ui="q"]')) { ui.q = t.value; ui.focusKey = 'ui:q'; scheduleRender(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches('[data-ui]')) return;
  if (t.dataset.ui === 'cat') ui.cat = t.value;
  if (t.dataset.ui === 'all') ui.all = t.checked;
  scheduleRender();
});
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-go],[data-act]') : null;
  if (ui.confirm && !(t && t.dataset.act === 'del')) { ui.confirm = null; scheduleRender(); }
  if (!t) return;
  if (t.dataset.go) { setView(t.dataset.go); return; }
  const act = t.dataset.act;
  if (act === 'tbl') { ui.tables[t.dataset.id] = !ui.tables[t.dataset.id]; scheduleRender(); return; }
  if (act === 'scen-reset') { ui.scen = { delay: 0, extend: 0, per: {} }; scheduleRender(); return; }
  if (act === 'del') {
    const key = t.dataset.coll + ':' + t.dataset.id;
    if (ui.confirm === key) { ui.confirm = null; deleteDoc(t.dataset.coll, t.dataset.id); }
    else { ui.confirm = key; scheduleRender(); }
    return;
  }
  if (act === 'add-project') {
    const cat = ui.cat !== 'All' ? ui.cat : 'Multifamily', id = nextId('projects', PREFIX[cat] || 'PR');
    const order = state.projects.reduce((a, p) => Math.max(a, nz(p.order)), 0) + 10;
    addDoc('projects', id, { order, category: cat, name: 'New project', location: '', units: null, status: 'Scheduled', confidence: 1, counts: 'Yes', internal: 'No', contract: 0, start: null, completion: null, pctComplete: 0, startType: 'TBD', completionType: 'TBD', notes: '' });
    state.projects.push({ id, order, category: cat, name: 'New project', status: 'Scheduled', confidence: 1, counts: 'Yes', internal: 'No', contract: 0, start: null, completion: null, pctComplete: 0, startType: 'TBD', completionType: 'TBD', notes: '', location: '', units: null });
    ui.focusKey = fk('projects', id, 'name'); if (viewName !== 'projects') viewName = 'projects'; scheduleRender();
    setTimeout(() => { const el = document.querySelector('[data-fk="' + fk('projects', id, 'name') + '"]'); if (el) { el.scrollIntoView({ block: 'center' }); el.select && el.select(); } }, 60);
    return;
  }
  if (act === 'add-capital') {
    const id = nextId('capital', 'CAP');
    const doc = { project: '', category: 'Multifamily', type: 'Land', description: '', amount: 0, due: null, dateType: 'TBD', confidence: 1, include: 'No', notes: 'Enter a due date, then set Include to Yes' };
    addDoc('capital', id, doc); state.capital.push(Object.assign({ id }, doc));
    ui.focusKey = fk('capital', id, 'project'); scheduleRender();
    return;
  }
  if (act === 'export-forecast') exportForecast();
  if (act === 'export-projects') exportProjects();
});
function setView(v) {
  if (!NAV.some(n => n[0] === v)) return;
  viewName = v; ui.confirm = null;
  try { localStorage.setItem('vcp-view', v); } catch (e) {}
  scheduleRender(); window.scrollTo({ top: 0 });
}
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(runCharts, 120); });

/* ---------- exports ---------- */
function csvCell(v) {
  if (v == null) return '';
  if (typeof v === 'number') return String(v);
  let s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
async function saveCsv(name, rows) {
  let dl = null; try { dl = window.claude && await claude.use('downloads'); } catch (e) {}
  if (!dl) { toast('File downloads are not available in this view.'); return; }
  try { await dl.save({ filename: name, data: rows.map(r => r.map(csvCell).join(',')).join('\n') }); toast('Saved ' + name); }
  catch (e) { if (!e || e.code !== 'declined') toast('The file could not be saved.'); }
}
function exportForecast() {
  const sum = summary(), ym = sum.yearMonths, gy = sum.s.goalYear;
  const rows = [['Month', 'Multifamily', 'Subdivision', 'Custom Home', 'Base revenue', 'Weighted revenue', 'Monthly goal', 'Capital due']];
  const pk = a => sum.pick(a);
  ym.forEach((m, i) => rows.push([E.miLong(m), Math.round(pk(sum.byCat.Multifamily)[i]), Math.round(pk(sum.byCat.Subdivision)[i]), Math.round(pk(sum.byCat['Custom Home'])[i]), Math.round(pk(sum.base)[i]), Math.round(pk(sum.weighted)[i]), Math.round(sum.s.goal / 12), Math.round(pk(sum.capBy)[i])]));
  rows.push([gy + ' total', '', '', '', Math.round(sum.yearBase), Math.round(sum.yearWeighted), Math.round(sum.s.goal), Math.round(sum.capYear)]);
  saveCsv('Monthly forecast ' + gy + '.csv', rows);
}
function exportProjects() {
  const sum = summary(), gy = sum.s.goalYear;
  const rows = [['ID', 'Category', 'Project', 'Location', 'Units', 'Status', 'Confidence', 'Counts toward goal', 'Internal', 'Contract value', 'Construction start', 'Construction completion', 'Percent complete', 'Start date type', 'Completion date type', 'Remaining contract value', gy + ' revenue', 'Notes']];
  sum.rows.forEach(r => { const p = r.p; rows.push([p.id, p.category, p.name, p.location, p.units, p.status, p.confidence, p.counts, p.internal, p.contract, p.start, p.completion, p.pctComplete, p.startType, p.completionType, Math.round(r.remaining), Math.round(r.yearRev), p.notes]); });
  saveCsv('Projects.csv', rows);
}


/* =====================================================================
   HISTORY (change log kept by the database)
   ===================================================================== */
function viewHistory() {
  return head('History', 'Every change to projects, capital and settings, newest first. Kept by the database, so it survives for as long as the data does.',
    '<button class="btn" id="hist-refresh">Refresh</button>') + '<div id="hist"><div class="empty-chart">Loading the change log.</div></div>';
}
const HIST_SKIP = { updatedAt: 1, updatedBy: 1, id: 1 };
function histLabel(r) {
  const d = r.new_data || r.old_data || {};
  if (r.tbl === 'projects') return 'Project: ' + (d.name || r.row_id);
  if (r.tbl === 'capital') return 'Capital: ' + [d.project, d.description].filter(Boolean).join(', ');
  return 'Settings';
}
function histShow(v) { return v == null || v === '' ? 'empty' : typeof v === 'number' ? String(v) : String(v); }
function histChange(r) {
  if (r.op === 'INSERT') return 'Added';
  if (r.op === 'DELETE') return 'Removed';
  const a = r.old_data || {}, b = r.new_data || {}, out = [];
  Object.keys(Object.assign({}, a, b)).forEach(k => { if (!HIST_SKIP[k] && JSON.stringify(a[k]) !== JSON.stringify(b[k])) out.push(k + ': ' + histShow(a[k]) + ' to ' + histShow(b[k])); });
  return out.length > 3 ? out.slice(0, 3).join('; ') + '; and ' + (out.length - 3) + ' more' : out.join('; ') || 'No visible change';
}
async function loadHistory() {
  const host = $('#hist'); if (!host) return;
  const btn = $('#hist-refresh'); if (btn && !btn._bound) { btn._bound = true; btn.addEventListener('click', loadHistory); }
  try {
    const rows = await state.db.history(300);
    if (viewName !== 'history' || !$('#hist')) return;
    if (!rows.length) { $('#hist').innerHTML = dimBlock('No changes yet', 'Edits made from now on will be listed here with who made them.'); return; }
    $('#hist').innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Change</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td>' + esc(new Date(r.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) + '</td><td>' + esc(r.by_email || 'System') + '</td><td>' + esc(histLabel(r)) + '</td><td>' + esc(histChange(r)) + '</td></tr>').join('') +
      '</tbody></table></div>';
  } catch (e) { console.error(e); if ($('#hist')) $('#hist').innerHTML = dimBlock('Could not load history', 'Try Refresh in a moment.'); }
}


/* =====================================================================
   TEAM (administrators approve people and set roles)
   ===================================================================== */
const ROLE_NAMES = { pending: 'No access yet', viewer: 'Viewer', editor: 'Editor', admin: 'Admin' };
let teamRows = null, teamErr = null;
function viewTeam() {
  return head('Team', 'Approve people who have created an account and choose what each can do.',
    '<button class="btn" id="team-refresh">Refresh</button>') +
    '<div class="card"><p class="sub" style="margin:0">Viewer: can see everything, changes nothing. Editor: can change projects, capital and settings. Admin: an editor who can also manage this page. A new person sees a waiting screen until you give them a role, then they reload the page.</p></div>' +
    '<div id="team"><div class="empty-chart">Loading the team.</div></div>';
}
function drawTeam() {
  const host = $('#team'); if (!host) return;
  if (teamErr) { host.innerHTML = dimBlock('Could not load the team', teamErr); return; }
  if (!teamRows) return;
  const order = { pending: 0, admin: 1, editor: 2, viewer: 3 };
  const rows = teamRows.slice().sort((a, b) => (order[a.role] - order[b.role]) || String(a.email).localeCompare(String(b.email)));
  host.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>Person</th><th>Joined</th><th>Access</th></tr></thead><tbody>' + rows.map(r => {
    const me = r.id === state.uid;
    const opts = ['pending', 'viewer', 'editor', 'admin'].map(k => '<option value="' + k + '"' + (k === r.role ? ' selected' : '') + '>' + ROLE_NAMES[k] + '</option>').join('');
    return '<tr' + (r.role === 'pending' ? ' style="background:var(--surface2)"' : '') + '><td>' + esc(r.email) + (me ? '<span class="tag">You</span>' : '') + (r.role === 'pending' ? '<span class="tag">Waiting</span>' : '') + '</td><td>' +
      esc(new Date(r.created_at).toLocaleDateString([], { dateStyle: 'medium' })) + '</td><td><select class="in" style="appearance:auto;-webkit-appearance:menulist;border:1px solid var(--axis);border-radius:8px;padding:6px 8px;background:var(--surface)" data-team="' + esc(r.id) + '" aria-label="Access for ' + esc(r.email) + '"' + (me ? ' disabled title="You cannot change your own access"' : '') + '>' + opts + '</select></td></tr>';
  }).join('') + '</tbody></table></div>';
}
async function loadTeam() {
  const btn = $('#team-refresh'); if (btn && !btn._bound) { btn._bound = true; btn.addEventListener('click', loadTeam); }
  if (teamRows) drawTeam();
  try {
    teamRows = await state.team.list(); teamErr = null;
    state.pending = teamRows.filter(r => r.role === 'pending').length;
    if (viewName === 'team') { drawTeam(); renderNav(); }
  } catch (e) { console.error(e); teamErr = 'Try Refresh in a moment.'; drawTeam(); }
}
document.addEventListener('change', async e => {
  const el = e.target.closest ? e.target.closest('select[data-team]') : null; if (!el) return;
  const id = el.getAttribute('data-team'), role = el.value;
  try { await state.team.setRole(id, role); toast('Access updated.'); }
  catch (err) { console.error(err); toast((err && err.message) || 'Could not change access.'); }
  loadTeam();
});

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  renderAll();
  if (!window.claude || !window.claude.use) { state.dbState = 'missing'; renderAll(); return; }
  let db = null, user = null;
  try { db = await claude.use('db'); } catch (e) {}
  try { user = await claude.use('user'); } catch (e) {}
  if (!db) { state.dbState = 'missing'; renderAll(); return; }
  state.db = db; state.dbState = 'ready';
  try { const tm = await claude.use('team'); if (tm) { state.team = tm; NAV.push(['team', 'Team']); state.team.list().then(r => { state.pending = r.filter(x => x.role === 'pending').length; renderNav(); }).catch(() => {}); } } catch (e) {}
  try { if (user) { state.uid = await user.id(); const cw = await user.can('data.write'); state.readOnly = cw === false; } } catch (e) {}
  const err = e => { console.error(e); if (e && e.code === 'revoked') { state.dbState = 'missing'; renderAll(); } };
  db.collection('projects').onSnapshot(snap => { state.projects = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); state.loaded.p = true; scheduleRender(); }, err);
  db.collection('capital').onSnapshot(snap => { state.capital = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); state.loaded.c = true; scheduleRender(); }, err);
  db.doc('settings/main').onSnapshot(snap => { state.settings = snap.exists ? Object.assign({}, snap.data()) : {}; state.loaded.s = true; scheduleRender(); }, err);
  renderAll();
}
boot();
})();

</script>
